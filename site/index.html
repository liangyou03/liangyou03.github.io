<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f2f4f6">
  <meta name="description" content="Liang You is a PhD student in Biostatistics at the University of Pittsburgh working on statistical machine learning for biomedical data.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Page of Liang">
  <meta property="og:description" content="PhD student in Biostatistics at the University of Pittsburgh.">
  <meta property="og:image" content="https://liangyou03.github.io/assets/before_the_sphinx.jpg">
  <title>Page of Liang</title>
  <script>document.documentElement.classList.add("js")</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <style>
    :root{
      --ink:#11151a;--ink-2:#3d4650;--muted:#687480;--faint:#9ba4ae;
      --paper:#f2f4f6;--line:rgba(17,21,26,.1);--line-2:rgba(17,21,26,.24);
      --accent:#135aa3;
      --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    }
    *{box-sizing:border-box;border-radius:0}
    html{scroll-behavior:smooth;scroll-padding-top:78px;background:var(--paper)}
    body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--sans);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-synthesis:none;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(rgba(17,21,26,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(17,21,26,.03) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,#000,transparent 85%);-webkit-mask-image:linear-gradient(to bottom,#000,transparent 85%)}
    canvas{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
    a{color:inherit;text-decoration:none}
    ::selection{background:var(--accent);color:#fff}
    :focus-visible{outline:1px solid var(--accent);outline-offset:3px}
    .wrap{width:min(1040px,calc(100% - 40px));margin:0 auto}
    .glass{border:1px solid rgba(255,255,255,.85);background:rgba(247,249,251,.66);box-shadow:0 10px 30px rgba(17,21,26,.07),inset 0 0 0 1px rgba(17,21,26,.04);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
    .u{border-bottom:1px solid var(--line-2);transition:color .2s,border-color .2s}
    .u:hover{color:var(--accent);border-color:var(--accent)}

    header{position:sticky;top:0;z-index:10;padding-top:10px}
    .nav{position:relative;height:50px;padding:0 20px;display:flex;align-items:center;justify-content:center}
    .nav:after{content:"";position:absolute;left:-1px;bottom:-1px;height:1px;width:calc(var(--progress,0) * 100%);background:var(--accent)}
    .links{flex:0 1 600px;display:flex;justify-content:space-between;gap:16px;font:400 .72rem var(--mono);color:var(--muted)}
    .links a{white-space:nowrap;transition:color .2s}
    .links a:hover,.links a.active{color:var(--ink)}
    .links a.active{box-shadow:0 1px 0 var(--accent)}

    .hero{position:relative;padding:56px 0 50px;overflow:hidden}
    .hero:after{content:"";position:absolute;z-index:-1;width:720px;height:720px;right:-200px;top:-300px;border-radius:50%;background:radial-gradient(circle,rgba(19,90,163,.15),rgba(19,90,163,0) 66%);pointer-events:none}
    .hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 264px;gap:64px;align-items:center}
    .prompt{margin:0;font:400 .72rem var(--mono);color:var(--muted)}
    .prompt b{font-weight:500;color:var(--accent)}
    .caret{display:inline-block;width:.55em;height:1.1em;margin-left:4px;vertical-align:-.2em;background:var(--accent);animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    h1{margin:16px 0 12px;font:700 clamp(3.1rem,7vw,5.4rem)/.94 var(--sans);letter-spacing:-.058em}
    .role{margin:0;font:400 .8rem/1.6 var(--mono);color:var(--ink-2);letter-spacing:-.015em}
    .bio{max-width:58ch;margin:22px 0 0;color:var(--ink-2);font-size:1rem;line-height:1.65}
    .reach{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:22px;font:400 .78rem var(--mono);letter-spacing:-.01em}
    .reach a{padding-bottom:1px}

    .window{margin:0;overflow:hidden}
    .window-bar{display:flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-bottom:1px solid rgba(17,21,26,.08);font:400 .64rem var(--mono);color:var(--muted)}
    .window-bar i{width:7px;height:7px;background:rgba(17,21,26,.16)}
    .window-bar span{margin-left:8px;letter-spacing:-.01em}
    .window img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover}
    .spec{margin:0;padding:2px 12px 4px;border-top:1px solid rgba(17,21,26,.08)}
    .spec div{display:grid;grid-template-columns:60px 1fr;gap:8px;padding:7px 0;border-top:1px solid rgba(17,21,26,.07)}
    .spec div:first-child{border-top:0}
    .spec dt{font:400 .6rem/1.9 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
    .spec dd{margin:0;display:flex;align-items:center;gap:8px;font:400 .72rem/1.6 var(--mono);color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
    .pulse{position:relative;flex:none;width:6px;height:6px;background:#1f9d55}
    .pulse:after{content:"";position:absolute;inset:-3px;border:1px solid #1f9d55;opacity:0;animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
    @keyframes ping{0%{transform:scale(.5);opacity:.8}80%,100%{transform:scale(1.5);opacity:0}}

    section{padding:42px 0;border-top:1px solid var(--line)}
    .sec{display:grid;grid-template-columns:184px minmax(0,1fr);gap:40px}
    .sec-head{align-self:start;position:sticky;top:84px}
    h2{margin:0;font:650 1.35rem/1.2 var(--sans);letter-spacing:-.035em}
    .list{border-top:1px solid var(--ink)}
    .item{display:grid;grid-template-columns:100px minmax(0,1fr);gap:20px;padding:12px 0;border-bottom:1px solid var(--line)}
    .when{font:400 .7rem/1.9 var(--mono);color:var(--muted);white-space:nowrap}
    .when em{display:block;font-style:normal;color:var(--accent)}
    .item h3{margin:0;font:500 .98rem/1.45 var(--sans);letter-spacing:-.014em}
    .item p{margin:2px 0 0;font-size:.87rem;color:var(--ink-2)}
    .item .fine{margin-top:3px;font:400 .72rem/1.55 var(--mono);color:var(--muted);letter-spacing:-.01em}
    .item .fine a{color:var(--ink)}
    .news-text{margin:0;font-size:.94rem;line-height:1.55;color:var(--ink-2)}.news-text strong{color:var(--ink);font-weight:600}
    .news-text a{color:var(--ink);transition:color .2s}.news-text a:after{content:" ↗";color:var(--faint);font-size:.85em}.news-text a:hover{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}

    .paper{padding:14px 0;border-bottom:1px solid var(--line)}
    .paper-venue{margin:0 0 4px;font:500 .66rem var(--mono);color:var(--accent);letter-spacing:.01em}
    .paper h3{margin:0 0 5px;font:500 .96rem/1.42 var(--sans);letter-spacing:-.014em}
    .paper h3 a{transition:color .2s}.paper h3 a:hover{color:var(--accent)}
    .authors{margin:0;font-size:.84rem;color:var(--muted)}
    .authors strong{color:var(--ink);font-weight:600}
    .authors sup{font:500 .6rem var(--mono);color:var(--accent);margin-left:1px}
    .actions{display:flex;flex-wrap:wrap;gap:16px;margin-top:8px;font:400 .68rem var(--mono)}
    .actions a,.actions button{padding:0 0 1px;border:0;border-bottom:1px solid var(--line-2);background:none;color:var(--ink);font:inherit;cursor:pointer;transition:color .2s,border-color .2s}
    .actions a:hover,.actions button:hover,.actions button[aria-expanded="true"]{color:var(--accent);border-color:var(--accent)}
    .bib{position:relative;margin-top:12px;background:#11151a}
    .bib pre{margin:0;padding:16px 18px;overflow-x:auto;font:400 .7rem/1.65 var(--mono);color:#d5dce4}
    .bib button{position:absolute;top:0;right:0;height:28px;padding:0 12px;border:0;border-left:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);background:#11151a;color:#9aa6b2;font:400 .64rem var(--mono);cursor:pointer}
    .bib button:hover{color:#fff}

    footer{padding:14px 0 22px}
    .foot{display:flex;justify-content:space-between;gap:16px;padding-top:14px;border-top:1px solid var(--line);font:400 .64rem var(--mono);color:var(--muted)}

    .js .reveal{opacity:0;transform:translateY(12px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}
    .js .reveal.visible{opacity:1;transform:none}

    @media (max-width:860px){
      .hero-grid{grid-template-columns:minmax(0,1fr) 220px;gap:40px}
      .sec{grid-template-columns:1fr;gap:16px}
      .sec-head{position:static}
    }
    @media (max-width:680px){
      .wrap{width:calc(100% - 32px)}
      header{padding-top:8px}.nav{height:48px;padding:0 14px}
      .hero{padding:34px 0 40px}
      .hero-grid{grid-template-columns:1fr;gap:32px}
      .window{max-width:300px}
      section{padding:34px 0}
      .item{grid-template-columns:1fr;gap:4px}
      .foot{flex-direction:column}
    }
    @media (max-width:560px){
      .nav{height:auto;padding:10px 14px}
      .links{flex:1;display:grid;grid-template-columns:repeat(3,auto);gap:8px 12px}
    }
    @media (prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}.caret,.pulse:after{animation:none}
      .js .reveal{opacity:1;transform:none;transition:none}
    }
  </style>
</head>
<body>
  <canvas id="dots" aria-hidden="true"></canvas>

  <header>
    <nav class="wrap nav glass" aria-label="Primary">
      <div class="links">
        <a href="#publications" data-section="publications">publications()</a>
        <a href="#news" data-section="news">news()</a>
        <a href="#teaching" data-section="teaching">teaching()</a>
        <a href="#honors" data-section="honors">honors()</a>
        <a href="#education" data-section="education">education()</a>
      </div>
    </nav>
  </header>

  <main id="top">
    <div class="hero">
      <div class="wrap hero-grid">
        <div>
          <p class="prompt"><b>~/liang.you</b> $ whoami<span class="caret" aria-hidden="true"></span></p>
          <h1 id="profile-name">Liang You</h1>
          <p class="role" id="position">PhD Student in Biostatistics</p>
          <p class="bio" id="bio"></p>
          <div class="reach">
            <a class="u" data-email href="mailto:liangyou03@pitt.edu">liangyou03@pitt.edu</a>
            <a class="u" data-github href="https://github.com/liangyou03" target="_blank" rel="noreferrer">github.com/liangyou03</a>
          </div>
        </div>
        <figure class="window glass">
          <div class="window-bar" aria-hidden="true"><i></i><i></i><i></i><span id="photo-label">before_the_sphinx.jpg</span></div>
          <img id="photo" src="assets/before_the_sphinx.jpg" alt="Liang You in front of the Great Sphinx of Giza" width="960" height="1200">
          <dl class="spec">
            <div><dt>Location</dt><dd id="location">Pittsburgh, PA</dd></div>
            <div><dt>Local</dt><dd id="clock">--:--</dd></div>
            <div><dt>Status</dt><dd><span class="pulse" aria-hidden="true"></span><span id="status">Open to collaborations</span></dd></div>
          </dl>
        </figure>
      </div>
    </div>

    <section id="publications">
      <div class="wrap sec">
        <div class="sec-head"><h2>Publications</h2></div>
        <div class="list reveal" id="publication-list"></div>
      </div>
    </section>

    <section id="news">
      <div class="wrap sec">
        <div class="sec-head"><h2>News</h2></div>
        <div class="list reveal" id="news-list"></div>
      </div>
    </section>

    <section id="teaching">
      <div class="wrap sec">
        <div class="sec-head"><h2>Teaching</h2></div>
        <div class="list reveal" id="workshop-list"></div>
      </div>
    </section>

    <section id="honors">
      <div class="wrap sec">
        <div class="sec-head"><h2>Honors</h2></div>
        <div class="list reveal" id="honors-list"></div>
      </div>
    </section>

    <section id="education">
      <div class="wrap sec">
        <div class="sec-head"><h2>Education</h2></div>
        <div class="list reveal" id="education-list"></div>
      </div>
    </section>

  </main>

  <footer>
    <div class="wrap foot"><span id="copyright">© 2026 Liang You</span></div>
  </footer>

  <script src="profile.js"></script>
  <script src="app.js"></script>
</body>
</html>
